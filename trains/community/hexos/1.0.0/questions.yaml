groups:
  - name: HexOS
    description: Nothing to configure here. Once the app runs, open its Web UI and choose Claim this server.
  - name: Storage Configuration
    description: Where HexOS keeps its own settings on this server.

questions:
  - variable: hexos
    label: ""
    group: HexOS
    schema:
      type: dict
      attrs: []

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: HexOS Data
          description: HexOS's own settings and local records. Nothing of yours is stored here.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: ix_volume
                  hidden: true
              - variable: ix_volume_config
                label: ""
                schema:
                  type: dict
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        default: hexos_data
                        hidden: true
